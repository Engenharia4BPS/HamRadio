; GADX Vector Hub - SPIKE 02
; Baseline de configuracao para runtime/service/installer multi-client.

[cat]
; Portas internas do Vector. Os aplicativos usam a outra ponta dos pares com0com.
ports = COM101, COM103
baud = 19200

[keying]
; Formato: clientN = PORTA_VECTOR,PTT_INPUT,CW_INPUT
client1 = COM102,DTR,RTS
client2 = COM104,DTR,NONE

[radio_keying]
; Exemplo de bancada. Ajustar por instalacao.
port = COM4
baud = 19200
ptt_line = RTS
cw_line = DTR

[rig]
host = 127.0.0.1
port = 4532
poll_ms = 250

[runtime]
allow_write = true
allow_ptt = true
allow_cw = true

[service]
startup = delayed-auto
recovery = restart

[logging]
level = INFO
max_mb = 5
backups = 5

[ports]
; Politica do provisionador. Estes valores sao preferencias, nao reservas.
application_start = 15
vector_start = 101
