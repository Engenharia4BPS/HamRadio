[cat]
; Configuracao de bancada validada no SPIKE (nao e a numeracao-alvo do instalador).
; COM101 <-> COM28 = LogHX
; COM103 <-> COM26 = N1MM
; COM105 <-> COM25 = terceiro cliente CAT
; COM107 <-> COM20 = OmniRig
ports = COM101, COM103, COM105, COM107
baud = 19200

[keying]
; Formato: clientN = PORTA_VECTOR,PTT_INPUT,CW_INPUT
; DTR no software e observado como DSR/DCD na outra ponta do par com0com.
; RTS no software e observado como CTS na outra ponta do par com0com.
;
; COM102 <-> COM30 = logger: PTT via DTR / CW via RTS
; COM104 <-> COM27 = MMTTY: PTT via DTR / sem CW
; COM106 <-> COM29 = Nexus: PTT via RTS / CW via DTR
client1 = COM102,DTR,RTS
client2 = COM104,DTR,NONE
client3 = COM106,RTS,DTR

[radio_keying]
; Porta serial fisica da interface/radio. O mapeamento e configuravel por instalacao.
port = COM4
baud = 19200
ptt_line = RTS
cw_line = DTR

[rig]
host = 127.0.0.1
port = 4532
poll_ms = 250

[bridge]
allow_write = true
allow_ptt = true
allow_cw = true

; DEBUG para diagnostico. Para CW em operacao normal, prefira INFO para reduzir I/O.
log_level = INFO

; Estes limites pertencem ao wrapper de servico, nao ao processo da bridge executado sozinho.
log_max_mb = 5
log_backups = 5

; Politica planejada para instalacao automatica futura:
; - lado apresentado aos aplicativos: tentar COM15, COM16, COM17... em ordem crescente;
; - lado interno do Vector: COM101, COM102, COM103...;
; - nunca substituir uma COM ocupada: avancar para a proxima livre.
