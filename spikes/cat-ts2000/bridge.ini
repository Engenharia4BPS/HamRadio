[bridge]
# GADX Vector TS-2000 SPIKE
# Configuracao validada com N1MM Logger+ e Icom IC-7760.
# Argumentos de linha de comando sobrescrevem estes valores.

# Fachada CAT TS-2000 apresentada ao logger.
port = COM18
baud = 19200

# Entrada de keying vinda do segundo par com0com.
# No teste: N1MM COM31 -> Vector COM32.
keying_port = COM32
keying_baud = 19200

# Saida fisica de CW para o radio.
# IC-7760 USB(B) no PC de teste.
radio_keying_port = COM22
radio_keying_baud = 9600

# Hamlib rigctld. O IC-7760 USB(A)/COM20 fica configurado no proprio rigctld.
rig_host = 127.0.0.1
rig_port = 4532
poll_ms = 250

# Habilitacoes de escrita/transmissao.
# ATENCAO: true permite que o logger altere o radio e coloque RF no ar.
allow_write = true
allow_ptt = true
allow_cw = true

# DEBUG, INFO, WARNING ou ERROR
log_level = INFO
