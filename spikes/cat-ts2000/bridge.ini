[bridge]
# GADX Vector TS-2000 SPIKE - CONFIGURACAO LEGADA SINGLE-CLIENT
#
# Este arquivo documenta a primeira geracao do SPIKE e permanece para
# regressao/historico. Para novos testes multi-client, use bridge_multi.ini.
# A numeracao COM abaixo pertence a uma bancada antiga e NAO define a politica
# de portas do instalador futuro.
#
# Configuracao originalmente validada com N1MM Logger+ e Icom IC-7760.

# Fachada CAT TS-2000 apresentada ao logger.
port = COM18
baud = 19200

# Entrada de keying vinda do segundo par com0com.
# No teste historico: N1MM COM31 -> Vector COM32.
keying_port = COM32
keying_baud = 19200

# Saida fisica de keying usada naquela bancada.
radio_keying_port = COM22
radio_keying_baud = 9600

# Hamlib rigctld. A COM fisica de CAT do radio fica configurada no rigctld,
# nao nesta fachada TS-2000.
rig_host = 127.0.0.1
rig_port = 4532
poll_ms = 250

allow_write = true
allow_ptt = true
allow_cw = true

# DEBUG, INFO, WARNING ou ERROR
log_level = INFO

# NOTA: a geracao multi-client usa secoes separadas [cat], [keying],
# [radio_keying], [rig] e [bridge], alem de permitir ptt_line/cw_line por INI.
