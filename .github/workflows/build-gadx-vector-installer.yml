name: Build GADX Vector Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'spikes/vector-hub-service/**'
      - '.github/workflows/build-gadx-vector-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show release metadata
        shell: powershell
        run: |
          Get-Content 'spikes/vector-hub-service/installer/release.json'
          git rev-parse HEAD

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer EXE
        shell: powershell
        run: |
          $script = 'spikes/vector-hub-service/installer/build-windows-exe.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) {
            throw "build-windows-exe.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Verify generated artifacts
        shell: powershell
        run: |
          $release = Get-Content 'spikes/vector-hub-service/installer/release.json' -Raw | ConvertFrom-Json
          $version = [string]$release.version
          $exe = "spikes/vector-hub-service/dist/exe/GADX-Vector-Setup-$version.exe"
          $sha = "$exe.sha256"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Installer EXE not found: $exe" }
          if (-not (Test-Path $sha -PathType Leaf)) { throw "Installer SHA256 not found: $sha" }
          Get-Item $exe,$sha | Format-Table FullName,Length
          Get-FileHash $exe -Algorithm SHA256

      - name: Create ZIP download bundle
        shell: powershell
        run: |
          $release = Get-Content 'spikes/vector-hub-service/installer/release.json' -Raw | ConvertFrom-Json
          $version = [string]$release.version
          $dir = 'spikes/vector-hub-service/dist/exe'
          $exe = Join-Path $dir "GADX-Vector-Setup-$version.exe"
          $sha = "$exe.sha256"
          $zip = Join-Path $dir "GADX-Vector-Setup-$version.zip"

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -LiteralPath $exe,$sha -DestinationPath $zip -CompressionLevel Optimal -Force

          if (-not (Test-Path $zip -PathType Leaf)) { throw "ZIP bundle not produced: $zip" }
          Get-Item $zip | Format-Table FullName,Length
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: GADX-Vector-Setup
          path: |
            spikes/vector-hub-service/dist/exe/GADX-Vector-Setup-*.exe
            spikes/vector-hub-service/dist/exe/GADX-Vector-Setup-*.exe.sha256
            spikes/vector-hub-service/dist/exe/GADX-Vector-Setup-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content 'spikes/vector-hub-service/installer/release.json' -Raw | ConvertFrom-Json
          $version = [string]$release.version
          $tag = "gadx-vector-v$version"
          $exe = "spikes/vector-hub-service/dist/exe/GADX-Vector-Setup-$version.exe"
          $sha = "$exe.sha256"
          $zip = "spikes/vector-hub-service/dist/exe/GADX-Vector-Setup-$version.zip"
          $title = "GADX Vector $version"

          $savedErrorAction = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $savedErrorAction

          if ($releaseExists) {
            gh release upload $tag $exe $sha $zip --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed." }
          }
          else {
            $notes = @"
          Development build of GADX Vector.

          Includes Port Manager v0.15 with CLIENTE / CAT / CW KEYING / FSK KEYING grouping.

          This build is published as a prerelease because clean-VM validation was intentionally skipped.
          "@
            gh release create $tag $exe $sha $zip --prerelease --title $title --notes $notes --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
          }
